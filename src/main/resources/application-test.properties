spring.datasource.url=jdbc:postgresql://localhost:5432/promptdb-test
spring.datasource.username=${SPRING_DATASOURCE_USERNAME_TEST}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD_TEST}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate

admin.email=${ADMIN_EMAIL_TEST}
admin.password=${ADMIN_PASSWORD_TEST}

server.port=8082

minio.endpoint=http://localhost:9000
minio.bucket=test-bucket

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=5000

spring.test.context.cache.maxSize=3
